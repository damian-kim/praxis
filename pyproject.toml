[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsim-local"
version = "0.1.0"
description = "Physics-world evaluation lab for embodied agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn>=0.34"
]

[project.optional-dependencies]
dev = ["httpx2>=2.10", "pytest>=8.3"]
physics = ["mujoco==3.11.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
